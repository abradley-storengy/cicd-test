name: Deploy

on:
  workflow_dispatch:
    inputs:
      appver:
        description: 'App Version'
        required: true

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: APPVER
        run: echo ${{ github.event.inputs.appver }}
      - name: Approval
        if: ${{ github.event.inputs.skip_approval }} != true
        run: echo Approved
      - name: Approval Skipped
        if: ${{ github.event.inputs.skip_approval }} == true
        run: echo Approval skipped
