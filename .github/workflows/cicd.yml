name: Node.js CI

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  start-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Start
        run: echo Starting...
  stop-runner:
    runs-on: ubuntu-latest
    needs: [start-runner, build]
    if: ${{ always() }}
    steps:
      - name: Stop
        run: echo Stopping...
  build:
    runs-on: ubuntu-latest
    needs: start-runner
    steps:
      - name: Build
        run: echo Building...
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        run: echo Deploying...

