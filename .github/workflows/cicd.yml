name: Node.js CI

on:
  pull_request:
    branches:
      - develop

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Checkout code
        uses: actions/checkout@master
        with:
          fetch-tags: true
  showResult:
    runs-on: ubuntu-latest
    needs: [ deploy ]
    if: always()
    steps:
      - run: echo ${{ needs.deploy.result }}
