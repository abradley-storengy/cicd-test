name: Node.js CI

on:
  push:
    branches:
      - develop
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  tag:
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    steps:
      - name: Checkout code
        uses: actions/checkout@master
      - uses: fregante/setup-git-user@v2
      - name: Bump version
        run: |
          npm version patch
          git push --follow-tags
  release:
    runs-on: ubuntu-latest
    needs: tag
    steps:
      - name: Checkout code
        uses: actions/checkout@master
      # - name: Create Release
        # id: create_release
        # uses: ncipollo/release-action@v1
        # with:
          # generateReleaseNotes: true
